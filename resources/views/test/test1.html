<!DOCTYPE html>
<html>

<head>
    <title>Add Map</title>

    <style>/* Always set the map height explicitly to define the size of the div
        * element that contains the map. */
 #map {
   height: 500px;
   width: 400px;
 }

 /* Optional: Makes the sample page fill the window. */
 html,
 body {
   height: 100%;
   margin: 0;
   padding: 0;
 }

 /* The popup bubble styling. */



 </style>


    <!-- jsFiddle will insert css and js -->
</head>

<body>
    <h3>My Google Maps Demo</h3>
    <!--The div element for the map -->
    <div id="map"></div>

    <!-- Async script executes immediately and must be after any DOM elements used in callback. -->
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA0cH-gsRcjZEQD5ab9mFyldU2v7T6QURY&callback=initMap&libraries=&v=weekly&channel=2"
        async></script>

    <script>
        function initMap() {
            // The location of Uluru
            const uluru = { lat: -25.344, lng: 131.036 };
            // The map, centered at Uluru
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 4,
                center: uluru,
            });
            // The marker, positioned at Uluru
            const marker = new google.maps.Marker({
                position: uluru,
                map: map,
            });
        }
    </script>

</body>

</html>
